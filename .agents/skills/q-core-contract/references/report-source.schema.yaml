$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar report source
type: object
required: [schema_version, report, source_snapshot, coverage, sections, decisions_requested, risks_referenced, recommendations, next_actions, channels_requested, approvals]
additionalProperties: false
properties:
  schema_version: {const: "1.0"}
  report:
    type: object
    required: [report_id, version, lifecycle, report_type, project_id, title, audience, purpose, reporting_period, confidentiality, language]
    additionalProperties: false
    properties:
      report_id: {type: string}
      version: {type: string}
      lifecycle: {enum: [Working, Baselined, Superseded, Archived]}
      report_type: {enum: [progress, feature, milestone, release, completion, consulting, executive, custom]}
      content_profile: {enum: [general, market-research]}
      project_id: {type: string}
      title: {type: string}
      audience: {type: string}
      purpose: {type: string}
      reporting_period:
        type: object
        required: [from, to, as_of]
        additionalProperties: false
        properties:
          from: {type: [string, "null"]}
          to: {type: [string, "null"]}
          as_of: {type: string}
      confidentiality: {type: string}
      language: {type: string}
  source_snapshot:
    type: object
    required: [status, approved_at, approval_ref, sources]
    additionalProperties: false
    properties:
      status: {enum: [proposed, approved]}
      approved_at: {type: [string, "null"]}
      approval_ref: {type: [string, "null"]}
      sources:
        type: array
        minItems: 1
        items:
          type: object
          required: [artifact_id, version, owner_workflow, owner_skill, lifecycle, semantic_authority, authority_scope, usage, reporting_approval_ref]
          additionalProperties: false
          properties:
            artifact_id: {type: string}
            version: {type: string}
            owner_workflow: {type: string}
            owner_skill: {type: string}
            lifecycle: {enum: [Working, Baselined, Released, Superseded, Archived]}
            semantic_authority: {enum: [canonical, supporting, none]}
            authority_scope: {type: string}
            usage: {type: string}
            reporting_approval_ref: {type: [string, "null"]}
  coverage:
    type: object
    required: [included, excluded, gaps]
    additionalProperties: false
    properties:
      included:
        type: array
        items: {type: string}
      excluded:
        type: array
        items: {type: string}
      gaps:
        type: array
        items: {type: string}
  sections:
    type: array
    minItems: 1
    items:
      type: object
      required: [section_id, title, purpose, blocks]
      additionalProperties: false
      properties:
        section_id: {type: string}
        title: {type: string}
        purpose: {type: string}
        blocks:
          type: array
          minItems: 1
          items:
            type: object
            required: [block_id, kind, statement, source_refs, qualifiers, visual_intent]
            additionalProperties: false
            properties:
              block_id: {type: string}
              kind: {enum: [fact, metric, estimate, interpretation, recommendation, projection, decision-request, risk, next-action]}
              statement: {type: string}
              source_refs:
                type: array
                items: {type: string}
              evidence_refs:
                type: array
                items:
                  type: object
                  required: [artifact_id, version, ref_type, ref_id]
                  additionalProperties: false
                  properties:
                    artifact_id: {type: string}
                    version: {type: string}
                    ref_type: {enum: [finding, calculation, assumption, analysis-result, scenario]}
                    ref_id: {type: string}
              qualifiers:
                type: array
                items: {type: string}
              visual_intent: {type: [string, "null"]}
  decisions_requested:
    type: array
    items: {type: string}
  risks_referenced:
    type: array
    items: {type: string}
  recommendations:
    type: array
    items: {type: string}
  next_actions:
    type: array
    items: {type: string}
  channels_requested:
    type: array
    minItems: 1
    items: {enum: [document, deck]}
  approvals:
    type: array
    items: {type: string}
