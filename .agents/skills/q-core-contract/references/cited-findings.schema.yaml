$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar cited findings register
type: object
required: [schema_version, register, sources, search_log, findings]
additionalProperties: false
properties:
  schema_version: {const: "1.0"}
  register:
    type: object
    required: [register_id, version, lifecycle, research_type, scope_ref]
    additionalProperties: false
    properties:
      register_id: {type: string}
      version: {type: string}
      lifecycle: {enum: [Working, Baselined, Superseded, Archived]}
      research_type: {enum: [engagement, technical]}
      scope_ref:
        type: object
        required: [reference_type, reference_id, version]
        additionalProperties: false
        properties:
          reference_type: {enum: [research-brief, project-artifact, user-request]}
          reference_id: {type: string}
          version: {type: [string, "null"]}
  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [source_id, title, publisher, owner_or_independence, published_at, accessed_at, url_or_locator, provenance_class, conflicts, currency_notes, independence_group, source_verification]
      additionalProperties: false
      properties:
        source_id: {type: string}
        title: {type: string}
        publisher: {type: string}
        owner_or_independence: {type: string}
        published_at: {type: [string, "null"]}
        accessed_at: {type: string}
        url_or_locator: {type: string}
        provenance_class: {enum: [authoritative-primary, formal-independent, transparent-analysis, specialist-editorial, experiential-community]}
        conflicts:
          type: array
          items: {type: string}
        currency_notes: {type: string}
        independence_group: {type: string}
        source_verification: {enum: [verified, mismatched, not-found, inaccessible]}
        measurement_context:
          type: object
          additionalProperties: false
          properties:
            geography: {type: [string, "null"]}
            period: {type: [string, "null"]}
            measure_type: {type: [string, "null"]}
            unit: {type: [string, "null"]}
            denominator_id: {type: [string, "null"]}
            currency: {type: [string, "null"]}
            base_year: {type: [integer, "null"]}
            price_basis: {type: [string, "null"]}
            taxonomy: {type: [string, "null"]}
            taxonomy_version: {type: [string, "null"]}
        methodology:
          type: object
          additionalProperties: false
          properties:
            original_producer: {type: [string, "null"]}
            source_type: {type: [string, "null"]}
            method: {type: [string, "null"]}
            covered_population: {type: [string, "null"]}
            sample: {type: [string, "null"]}
            limitations:
              type: array
              items: {type: string}
            revision_status: {type: [string, "null"]}
            vintage: {type: [string, "null"]}
        rights:
          type: object
          additionalProperties: false
          properties:
            license_or_terms: {type: [string, "null"]}
            archive_locator: {type: [string, "null"]}
  search_log:
    type: array
    minItems: 1
    items:
      type: object
      required: [search_id, question_ref, strategy, coverage_status, notes]
      additionalProperties: false
      properties:
        search_id: {type: string}
        question_ref: {type: string}
        strategy: {type: string}
        coverage_status: {enum: [planned-search-complete, partial, budget-exhausted, access-blocked, no-evidence-found]}
        notes: {type: string}
  findings:
    type: array
    minItems: 1
    items:
      type: object
      required: [finding_id, question_ref, claim, finding_status, corroboration, confidence, evidence_refs, conflicts, coverage_status, notes]
      additionalProperties: false
      properties:
        finding_id: {type: string}
        question_ref: {type: string}
        claim: {type: string}
        statement_class: {enum: [fact, source-estimate, calculation-input, forecast-input, opinion, recommendation]}
        finding_status: {enum: [supported, contradicted, unsupported]}
        corroboration: {enum: [primary-direct, multiple-independent, single-source, dependent-sources]}
        confidence: {enum: [low, medium, high]}
        evidence_refs:
          type: array
          items:
            type: object
            required: [source_ref, relation, claim_fit, locator]
            additionalProperties: false
            properties:
              source_ref: {type: string}
              relation: {enum: [supports, contradicts, contextualizes]}
              claim_fit: {enum: [direct, indirect, contextual]}
              locator: {type: string}
        conflicts:
          type: array
          items: {type: string}
        coverage_status: {enum: [planned-search-complete, partial, budget-exhausted, access-blocked, no-evidence-found]}
        notes: {type: string}
        quantitative:
          type: object
          additionalProperties: false
          properties:
            value: {type: [number, "null"]}
            range:
              type: object
              required: [minimum, maximum]
              additionalProperties: false
              properties:
                minimum: {type: number}
                maximum: {type: number}
            unit: {type: [string, "null"]}
            denominator_id: {type: [string, "null"]}
            geography: {type: [string, "null"]}
            period: {type: [string, "null"]}
            currency: {type: [string, "null"]}
            base_year: {type: [integer, "null"]}
            price_basis: {type: [string, "null"]}
            taxonomy: {type: [string, "null"]}
            revision_status: {type: [string, "null"]}
