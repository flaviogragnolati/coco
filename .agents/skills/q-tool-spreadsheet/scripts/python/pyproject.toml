[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-tool-spreadsheet-python"
version = "1.0.0"
description = "Local Python backend for Quasar q-tool-spreadsheet"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.5,<4"]

[project.scripts]
q-tool-spreadsheet-python = "spreadsheet_tool:main"

[tool.setuptools]
py-modules = ["spreadsheet_tool"]
