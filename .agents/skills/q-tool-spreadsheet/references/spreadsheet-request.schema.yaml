$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar spreadsheet request
type: object
additionalProperties: false
required: [schema_version, request_id, operation, caller, owner_skill, sources, workbook_type, intended_result, output, preservation_requirements, formula_requirements, forbidden_semantic_changes, runtime, validation, security]
properties:
  schema_version:
    const: "1.0"
  request_id:
    type: string
    minLength: 1
  operation:
    type: string
    enum: [inspect, extract, create, edit, convert, recalculate, render, check]
  caller:
    type: object
    additionalProperties: false
    required: [skill_id, mode]
    properties:
      skill_id: {type: string}
      workflow: {type: [string, "null"]}
      mode: {type: string, enum: [orchestrated, standalone]}
  owner_skill:
    type: string
    minLength: 1
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [ref, path]
      properties:
        ref: {type: string, minLength: 1}
        artifact_id: {type: [string, "null"]}
        version: {type: [string, "null"]}
        path: {type: string, minLength: 1}
        sha256: {type: [string, "null"], pattern: "^[a-f0-9]{64}$"}
  workbook_type:
    type: string
    enum: [xlsx, xlsm, xltx, xltm, csv, tsv]
  intended_result:
    type: string
    minLength: 1
  output:
    type: object
    additionalProperties: false
    required: [path, overwrite]
    properties:
      path: {type: [string, "null"]}
      overwrite: {type: boolean}
      approval_ref: {type: [string, "null"]}
      validation_dir: {type: [string, "null"]}
  preservation_requirements:
    type: array
    items: {type: string}
  formula_requirements:
    type: array
    items: {type: string}
  forbidden_semantic_changes:
    type: array
    items: {type: string}
  runtime:
    type: string
    enum: [auto, python, node]
  validation:
    type: object
    additionalProperties: false
    required: [structural, formulas, rendered]
    properties:
      structural: {type: boolean}
      formulas: {type: boolean}
      rendered: {type: boolean}
      inspect_all_sheets: {type: boolean}
  security:
    type: object
    additionalProperties: false
    required: [macros, external_links, data_connections, embedded_objects, signatures, protection, sensitive_content, retention_policy]
    properties:
      macros: {type: boolean}
      external_links: {type: boolean}
      data_connections: {type: boolean}
      embedded_objects: {type: boolean}
      signatures: {type: boolean}
      protection: {type: boolean}
      sensitive_content: {type: boolean}
      retention_policy: {type: [string, "null"]}
