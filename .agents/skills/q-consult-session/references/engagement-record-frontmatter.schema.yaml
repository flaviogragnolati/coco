$schema: "https://json-schema.org/draft/2020-12/schema"
title: Engagement record frontmatter
type: object
additionalProperties: false
required: [session_kind, date, participants, classification, evidence_ids, decisions, actions]
properties:
  session_kind: {type: string, enum: [kickoff, interview, workshop, training, committee, acceptance]}
  date: {type: string}
  participants:
    type: array
    minItems: 1
    items: {type: string}
  classification: {type: string, enum: [public, internal, confidential, restricted]}
  evidence_ids: {type: array, items: {type: string}}
  decisions: {type: array, items: {type: string}}
  actions: {type: array, items: {type: string}}
