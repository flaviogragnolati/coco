$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar PDF request
type: object
additionalProperties: false
required: [schema_version, request_id, operation, caller, owner_skill, sources, classification, page_scope, intended_result, output, preservation_requirements, forbidden_semantic_changes, runtime, validation]
properties:
  schema_version:
    const: "1.0"
  request_id:
    type: string
  operation:
    type: string
    enum: [inspect, extract-text, extract-tables, extract-images, merge, select, split, rotate, crop, watermark, form-list, form-fill, render, check, repair, linearize, decrypt, encrypt, ocr, create]
  caller:
    type: object
    additionalProperties: false
    required: [skill_id, mode]
    properties:
      skill_id:
        type: string
      workflow:
        type: [string, "null"]
      mode:
        type: string
        enum: [orchestrated, standalone]
  owner_skill:
    type: string
  owner_workflow:
    type: [string, "null"]
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        artifact_id:
          type: [string, "null"]
        version:
          type: [string, "null"]
        path:
          type: string
        sha256:
          type: [string, "null"]
  classification:
    type: string
  page_scope:
    type: string
  intended_result:
    type: string
  output:
    type: object
    additionalProperties: false
    required: [path, overwrite]
    properties:
      path:
        type: [string, "null"]
      output_dir:
        type: [string, "null"]
      overwrite:
        type: boolean
      approval_ref:
        type: [string, "null"]
      validation_dir:
        type: [string, "null"]
  preservation_requirements:
    type: array
    items:
      type: string
  forbidden_semantic_changes:
    type: array
    items:
      type: string
  runtime:
    type: string
    enum: [auto, python, node]
  validation:
    type: object
    additionalProperties: false
    required: [structural, rendered]
    properties:
      structural:
        type: boolean
      rendered:
        type: boolean
      inspected_pages:
        type: array
        items:
          type: integer
  security:
    type: object
    additionalProperties: false
    properties:
      encryption:
        type: boolean
      signatures:
        type: boolean
      redaction:
        type: boolean
      flattening:
        type: boolean
      sensitive_fields:
        type: boolean
      retention_policy:
        type: [string, "null"]
      secret_env_names:
        type: array
        items:
          type: string
