$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar market analysis
type: object
required: [schema_version, analysis, measurement_contract_ref, modules, assumptions, calculations, scenarios, published_results, exports, limitations, unresolved_reconciliation, validation_summary]
additionalProperties: false
properties:
  schema_version: {const: "1.0"}
  analysis:
    type: object
    required: [analysis_id, version, lifecycle, profile, brief_ref, findings_ref, as_of]
    additionalProperties: false
    properties:
      analysis_id: {type: string}
      version: {type: string}
      lifecycle: {const: Working}
      profile: {const: market}
      brief_ref:
        type: object
        required: [artifact_id, version]
        additionalProperties: false
        properties:
          artifact_id: {type: string}
          version: {type: string}
      findings_ref:
        type: object
        required: [artifact_id, version]
        additionalProperties: false
        properties:
          artifact_id: {type: string}
          version: {type: string}
      as_of: {type: string}
  measurement_contract_ref: {type: string}
  modules:
    type: array
    minItems: 1
    items:
      enum: [market-sizing, tam-sam-som, forecast, sensitivity, unit-normalization, top-down-bottom-up-reconciliation, competitive-landscape, concentration, demand-segmentation, scenario-analysis, custom-method]
  assumptions:
    type: array
    items:
      type: object
      required: [assumption_id, description, value_or_range, unit, finding_refs, rationale, sensitivity_range]
      additionalProperties: false
      properties:
        assumption_id: {type: string}
        description: {type: string}
        value_or_range:
          type: object
          additionalProperties: false
          properties:
            value: {type: [number, "null"]}
            minimum: {type: [number, "null"]}
            maximum: {type: [number, "null"]}
        unit: {type: string}
        finding_refs:
          type: array
          items: {type: string}
        rationale: {type: string}
        sensitivity_range:
          type: object
          required: [minimum, maximum]
          additionalProperties: false
          properties:
            minimum: {type: [number, "null"]}
            maximum: {type: [number, "null"]}
  calculations:
    type: array
    minItems: 1
    items:
      type: object
      required: [calculation_id, method, formula, input_refs, assumption_refs, script, rounding_policy]
      additionalProperties: false
      properties:
        calculation_id: {type: string}
        method: {enum: [top-down, bottom-up, reconciliation, forecast, sensitivity, unit-normalization, competitive-matrix, concentration, demand-segmentation, scenario-analysis, custom]}
        formula: {type: string}
        input_refs:
          type: array
          minItems: 1
          items:
            type: object
            required: [ref_type, ref_id]
            additionalProperties: false
            properties:
              ref_type: {enum: [finding, assumption, calculation]}
              ref_id: {type: string}
        assumption_refs:
          type: array
          items: {type: string}
        script:
          type: object
          required: [path, version, command, hash]
          additionalProperties: false
          properties:
            path: {type: string}
            version: {type: string}
            command: {type: string}
            hash: {type: string}
        rounding_policy: {type: string}
        custom_method:
          type: object
          required: [reason, code_path, hash, command, input_refs, verification, limitations, review_status, approval_ref]
          additionalProperties: false
          properties:
            reason: {type: string}
            code_path: {type: string}
            hash: {type: string}
            command: {type: string}
            input_refs:
              type: array
              minItems: 1
              items: {type: string}
            verification:
              type: array
              minItems: 1
              items: {type: string}
            limitations:
              type: array
              items: {type: string}
            review_status: {enum: [draft, reviewed, approved]}
            approval_ref: {type: [string, "null"]}
  scenarios:
    type: array
    items:
      type: object
      required: [scenario_id, label, assumption_refs, invalidation_conditions]
      additionalProperties: false
      properties:
        scenario_id: {type: string}
        label: {type: string}
        assumption_refs:
          type: array
          minItems: 1
          items: {type: string}
        invalidation_conditions:
          type: array
          minItems: 1
          items: {type: string}
  published_results:
    type: array
    items:
      type: object
      required: [result_id, calculation_ref, scenario_ref, value, range, unit, denominator_id, base_year, finding_refs, assumption_refs, qualifiers, export_locator]
      additionalProperties: false
      properties:
        result_id: {type: string}
        calculation_ref: {type: string}
        scenario_ref: {type: [string, "null"]}
        value: {type: [number, "null"]}
        range:
          type: object
          required: [minimum, maximum]
          additionalProperties: false
          properties:
            minimum: {type: [number, "null"]}
            maximum: {type: [number, "null"]}
        unit: {type: string}
        denominator_id: {type: string}
        base_year: {type: [integer, "null"]}
        finding_refs:
          type: array
          items: {type: string}
        assumption_refs:
          type: array
          items: {type: string}
        qualifiers:
          type: array
          items: {type: string}
        export_locator: {type: [string, "null"]}
  exports:
    type: array
    items:
      type: object
      required: [export_id, path, schema, hash, provenance, creation_mode, semantic_authority]
      additionalProperties: false
      properties:
        export_id: {type: string}
        path: {type: string}
        schema: {type: string}
        hash: {type: string}
        provenance: {type: string}
        creation_mode: {const: derived}
        semantic_authority: {const: none}
  limitations:
    type: array
    items: {type: string}
  unresolved_reconciliation:
    type: array
    items:
      type: object
      required: [reconciliation_id, calculation_refs, description, materiality, next_action]
      additionalProperties: false
      properties:
        reconciliation_id: {type: string}
        calculation_refs:
          type: array
          minItems: 2
          items: {type: string}
        description: {type: string}
        materiality: {enum: [low, medium, high]}
        next_action: {type: string}
  validation_summary:
    type: object
    required: [valid, validated_at, script_version, errors, warnings]
    additionalProperties: false
    properties:
      valid: {type: boolean}
      validated_at: {type: string}
      script_version: {type: string}
      errors:
        type: array
        items: {type: string}
      warnings:
        type: array
        items: {type: string}
