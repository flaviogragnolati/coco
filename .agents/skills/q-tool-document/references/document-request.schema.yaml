$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar document request
type: object
additionalProperties: false
required: [schema_version, request_id, operation, caller, owner_skill, sources, output, preservation_requirements, forbidden_semantic_changes, runtime, validation]
properties:
  schema_version:
    const: "1.0"
  request_id:
    type: string
  operation:
    type: string
    enum: [inspect, extract-text, create, replace-text, comment, redline, accept-changes, convert, render, check]
  caller:
    type: object
    additionalProperties: false
    required: [skill_id, mode]
    properties:
      skill_id:
        type: string
      workflow:
        type: [string, "null"]
      mode:
        type: string
        enum: [orchestrated, standalone]
  owner_skill:
    type: string
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        artifact_id:
          type: [string, "null"]
        version:
          type: [string, "null"]
        path:
          type: string
        sha256:
          type: [string, "null"]
  output:
    type: object
    additionalProperties: false
    required: [path, overwrite]
    properties:
      path:
        type: [string, "null"]
      overwrite:
        type: boolean
      approval_ref:
        type: [string, "null"]
      validation_dir:
        type: [string, "null"]
  preservation_requirements:
    type: array
    items:
      type: string
  forbidden_semantic_changes:
    type: array
    items:
      type: string
  runtime:
    type: string
    enum: [auto, python, node]
  validation:
    type: object
    additionalProperties: false
    required: [structural, rendered]
    properties:
      structural:
        type: boolean
      rendered:
        type: boolean
      inspect_all_pages:
        type: boolean
  security:
    type: object
    additionalProperties: false
    properties:
      macros:
        type: boolean
      external_relationships:
        type: boolean
      signatures:
        type: boolean
      protection:
        type: boolean
      tracked_changes:
        type: boolean
      comments:
        type: boolean
      sensitive_content:
        type: boolean
      retention_policy:
        type: [string, "null"]
