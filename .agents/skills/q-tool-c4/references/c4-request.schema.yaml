$schema: "https://json-schema.org/draft/2020-12/schema"
title: Quasar C4 request
type: object
required: [schema_version, c4_request]
additionalProperties: false
properties:
  schema_version: {const: "1.0"}
  c4_request:
    type: object
    required: [request_id, operation, caller, ownership, sources, scope, model, views, backend, output, policy]
    additionalProperties: false
    properties:
      request_id: {type: string}
      operation: {enum: [create, revise, validate, render]}
      caller:
        type: object
        required: [skill_id, workflow, mode]
        additionalProperties: false
        properties:
          skill_id: {type: string}
          workflow: {type: string}
          mode: {enum: [orchestrated, standalone]}
      ownership:
        type: object
        required: [owner_skill, owner_workflow, creation_mode, semantic_authority, authority_scope]
        additionalProperties: false
        properties:
          owner_skill: {type: string}
          owner_workflow: {type: string}
          creation_mode: {const: authored}
          semantic_authority: {const: supporting}
          authority_scope: {enum: [visual-representation, visual-model, visual-model-or-representation]}
      sources:
        type: array
        minItems: 1
        items:
          type: object
          required: [source_ref, version, evidence_class]
          additionalProperties: false
          properties:
            source_ref: {type: string}
            version: {type: string}
            evidence_class: {enum: [approved, observed, user-supplied]}
            owner_skill: {type: string}
      scope:
        type: object
        required: [subject, audience, purpose]
        additionalProperties: false
        properties:
          subject: {type: string}
          audience: {type: string}
          purpose: {type: string}
      model:
        type: object
        required: [elements, relationships]
        additionalProperties: false
        properties:
          elements:
            type: array
            minItems: 1
            items:
              type: object
              required: [element_id, name, element_type, description, evidence_refs, evidence_status]
              additionalProperties: false
              properties:
                element_id: {type: string}
                name: {type: string}
                element_type: {enum: [person, software-system, container, component, deployment-node, infrastructure-node, container-instance]}
                description: {type: string}
                parent_id: {type: string}
                technology: {type: string}
                external: {type: boolean}
                evidence_refs:
                  type: array
                  minItems: 1
                  items: {type: string}
                evidence_status: {enum: [approved, observed, inferred]}
          relationships:
            type: array
            items:
              type: object
              required: [relationship_id, source_id, destination_id, description, evidence_refs, evidence_status]
              additionalProperties: false
              properties:
                relationship_id: {type: string}
                source_id: {type: string}
                destination_id: {type: string}
                description: {type: string}
                technology: {type: string}
                evidence_refs:
                  type: array
                  minItems: 1
                  items: {type: string}
                evidence_status: {enum: [approved, observed, inferred]}
      views:
        type: array
        minItems: 1
        items:
          type: object
          required: [view_id, view_type, scope_ref, element_ids, relationship_ids, forbidden_inferences]
          additionalProperties: false
          properties:
            view_id: {type: string}
            view_type: {enum: [system-landscape, system-context, container, component, code, dynamic, deployment]}
            scope_ref: {type: string}
            element_ids:
              type: array
              minItems: 1
              items: {type: string}
            relationship_ids:
              type: array
              items: {type: string}
            forbidden_inferences:
              type: array
              items: {type: string}
      backend:
        type: object
        required: [preference, required_features, renderer_required]
        additionalProperties: false
        properties:
          preference: {enum: [auto, mermaid, structurizr, c4-plantuml]}
          required_features:
            type: array
            items: {enum: [synchronized-views, filtered-views, manual-layout, directional-layout, tags, sprites, legends, offline-render]}
          renderer_required: {type: boolean}
      output:
        type: object
        required: [source_targets, render_formats, profile, overwrite]
        additionalProperties: false
        properties:
          source_targets:
            type: array
            minItems: 1
            items:
              type: object
              required: [path, view_ids]
              additionalProperties: false
              properties:
                path: {type: string}
                view_ids:
                  type: array
                  minItems: 1
                  items: {type: string}
          render_formats:
            type: array
            items: {enum: [svg, png, pdf]}
          profile: {enum: [portable, github, static-light, static-dark, presentation]}
          overwrite: {type: boolean}
      policy:
        type: object
        required: [network, max_repair_attempts, allow_unverified_source]
        additionalProperties: false
        properties:
          network: {const: false}
          max_repair_attempts: {type: integer, minimum: 0, maximum: 2}
          allow_unverified_source: {type: boolean}
