$schema: "https://json-schema.org/draft/2020-12/schema"
title: Consulting acceptance record
type: object
additionalProperties: false
required: [schema_version, engagement_ref, acceptance_session, deliverables]
properties:
  schema_version: {type: string, const: "1.0"}
  engagement_ref: {type: string}
  acceptance_session:
    type: object
    additionalProperties: false
    required: [date, client_parties, quasar_parties]
    properties:
      date: {type: string}
      client_parties: {type: array, items: {type: string}}
      quasar_parties: {type: array, items: {type: string}}
      evidence_ref: {type: [string, "null"]}
  deliverables:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [deliverable_id, artifact_ref, criteria_ref, disposition, client_statement, reservations, rework_items, open_items]
      properties:
        deliverable_id: {type: string}
        artifact_ref: {type: string}
        criteria_ref: {type: array, minItems: 1, items: {type: string}}
        disposition: {type: string, enum: [accepted, accepted_with_reservations, rework, rejected, deferred]}
        evidence_ref: {type: [string, "null"]}
        client_statement: {type: string}
        reservations: {type: array, items: {type: string}}
        rework_items: {type: array, items: {type: string}}
        open_items: {type: array, items: {type: string}}
